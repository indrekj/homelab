version: 2

# Weekly PRs bumping the pinned image tags in services/*/docker-compose.yml.
#
# These are version updates only — Dependabot does not do security updates for
# the docker-compose ecosystem, so a PR here means "a newer tag exists", never
# "the tag you are on has a CVE". Merging a PR also does not deploy anything;
# the stack is deployed by hand (see the Deployment section of the README).
#
# The root docker-compose.yml is only `include:` statements — no images in it,
# so it needs no entry here.
updates:
  - package-ecosystem: docker-compose
    directories:
      - "/services/*"
    schedule:
      interval: weekly
      day: saturday
    # One PR for the whole stack rather than one per service.
    groups:
      homelab:
        patterns:
          - "*"
    # Majors are excluded so the grouped PR can be merged on sight. Do majors
    # by hand as their own change (see the README). The list is per image
    # rather than "*" because Home Assistant uses calendar versions: its
    # January release (2026.12 -> 2027.1) parses as a major and a blanket
    # ignore would silently stop its updates for the year. Ignore has no
    # exemption syntax, so a new service must be added here too.
    ignore:
      - dependency-name: traefik
        update-types: ["version-update:semver-major"]
      - dependency-name: eclipse-mosquitto
        update-types: ["version-update:semver-major"]
      - dependency-name: plexinc/pms-docker
        update-types: ["version-update:semver-major"]
      - dependency-name: lscr.io/linuxserver/*
        update-types: ["version-update:semver-major"]
      - dependency-name: golift/unpackerr
        update-types: ["version-update:semver-major"]
      - dependency-name: ghcr.io/cleanuparr/cleanuparr
        update-types: ["version-update:semver-major"]
      - dependency-name: ghcr.io/recyclarr/recyclarr
        update-types: ["version-update:semver-major"]
      - dependency-name: ghcr.io/seerr-team/seerr
        update-types: ["version-update:semver-major"]
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: rhasspy/*
        update-types: ["version-update:semver-major"]
      - dependency-name: louislam/uptime-kuma
        update-types: ["version-update:semver-major"]
      - dependency-name: ghcr.io/gethomepage/homepage
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 3
    commit-message:
      prefix: "Bump"
