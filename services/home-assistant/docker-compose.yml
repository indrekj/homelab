services:
  home-assistant:
    image: homeassistant/home-assistant:2026.8.3
    container_name: home-assistant
    restart: unless-stopped
    # HA's s6 init stays root and never drops to a service user, so only the
    # chown set is needed (see the README capability table).
    # NET_RAW is deliberately NOT added back: only DHCP discovery wants it,
    # and that cannot see LAN broadcasts from a bridge network anyway. On the
    # shared bridge NET_RAW permits ARP spoofing against every other
    # container. Re-add it only if a raw-socket integration is added.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    environment:
      TZ: Europe/Tallinn
    volumes:
      - /mnt/ssd-storage/homelab/home-assistant/config:/config
    networks:
      - homelab
    ports:
      - "5683:5683/udp"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

networks:
  homelab:
    external: true
