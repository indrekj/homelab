services:
  home-assistant:
    image: homeassistant/home-assistant:2026.7.1
    container_name: home-assistant
    restart: unless-stopped
    environment:
      TZ: Europe/Tallinn
    volumes:
      - /mnt/ssd-storage/homelab/home-assistant/config:/config
    networks:
      - homelab
    ports:
      - "5683:5683/udp"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

networks:
  homelab:
    external: true
