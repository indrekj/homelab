services:
  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4
    container_name: radarr
    restart: unless-stopped
    environment:
      TZ: Europe/Tallinn
      # Matches the owner of /mnt/hdd-storage/media so imports stay readable
      # by Plex and hardlinks into the library work.
      PUID: "568"
      PGID: "568"
      # stdout (docker logs) gets warnings and errors only. The file logs in
      # /config/logs stay at info: any LogLevel above info turns them off
      # completely, and they are what an import problem is debugged from.
      # Env overrides config.xml, which ships at debug.
      RADARR__LOG__LEVEL: info
      RADARR__LOG__CONSOLELEVEL: warn
    # The s6 init needs these to chown /config and drop to PUID/PGID; Radarr
    # itself needs none of them. Everything else — NET_RAW, MKNOD, SYS_PTRACE
    # and friends — is dropped. See services/qbittorrent/docker-compose.yml for
    # the full rationale.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - KILL
    volumes:
      - /mnt/ssd-storage/homelab/radarr/config:/config
      # Single mount covering downloads and the movie library so imports can
      # hardlink instead of copy. Root folder: /data/movies
      - /mnt/hdd-storage/media:/data
    networks:
      - homelab

networks:
  homelab:
    external: true
