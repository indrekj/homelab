services:
  plex:
    image: plexinc/pms-docker:1.43.3.10861-07dfddaeb
    container_name: plex
    restart: unless-stopped
    environment:
      TZ: Europe/Tallinn
      PLEX_CLAIM: ${PLEX_CLAIM:-}
      # Networks allowed to reach Plex WITHOUT authentication. Must not include
      # the Docker bridge (172.16.0.0/12) — Traefik proxies from there, so any
      # request arriving via plex.urgas.eu would inherit the bridge IP and skip
      # auth entirely. Keep this to the physical LAN only.
      ALLOWED_NETWORKS: "192.168.1.0/24"
      # Run Plex as `apps` (568), the unprivileged nologin account seerr and
      # recyclarr already use. Without these the image defaults to uid 1000,
      # which on this host is a real login account with a shell rather than a
      # service account. The s6 init still starts as root to chown /config and
      # /transcode and then drops to this uid; PMS itself has never run as root.
      PLEX_UID: 568
      PLEX_GID: 568
    # Plex needs no privileged operations of its own. The init does, so the
    # few capabilities it uses are added back: CHOWN/DAC_OVERRIDE/FOWNER for
    # the /config and /transcode chown, SETUID/SETGID to drop to the plex
    # user, KILL so the root s6 supervisor can signal its non-root children.
    # Everything else — NET_RAW, SYS_PTRACE, MKNOD and friends — is dropped.
    # Mapping the iGPU below needs none of them back: access to a device node
    # is decided by its file mode, not by a capability.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - KILL
    # Hardware transcoding on the host's Ryzen 5600G iGPU (Vega 7, VCN 2.1:
    # H.264 and HEVC encode, H.264/HEVC/VP9 decode — no AV1 either way).
    # Requires Plex Pass, which this server has.
    #
    # renderD128 is the render node VAAPI actually uses; card0 comes along
    # because Plex probes the whole directory. Both are mode 0660 on the host,
    # root:render (gid 107) and root:video (gid 44) respectively, and PMS runs
    # as 568 — so it needs those two as supplementary groups or every open()
    # is EACCES. group_add takes the host's numeric gids directly; the names
    # do not exist in the container's /etc/group and are not needed.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "107"
      - "44"
    ports:
      # Direct access port so LAN clients can reach Plex without going
      # through Traefik.
      - "32400:32400"
    volumes:
      - /mnt/ssd-storage/homelab/plex/config:/config
      - /mnt/hdd-storage/media:/media:ro
    networks:
      - homelab

networks:
  homelab:
    external: true
