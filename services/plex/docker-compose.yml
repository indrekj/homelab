services:
  plex:
    image: plexinc/pms-docker:1.43.3.10828-00f62d37d
    container_name: plex
    restart: unless-stopped
    environment:
      TZ: Europe/Tallinn
      PLEX_CLAIM: ${PLEX_CLAIM:-}
      # Networks allowed to reach Plex WITHOUT authentication. Must not include
      # the Docker bridge (172.16.0.0/12) — Traefik proxies from there, so any
      # request arriving via plex.urgas.eu would inherit the bridge IP and skip
      # auth entirely. Keep this to the physical LAN only.
      ALLOWED_NETWORKS: "192.168.1.0/24"
    ports:
      # Direct access port so LAN clients can reach Plex without going
      # through Traefik.
      - "32400:32400"
    volumes:
      - /mnt/ssd-storage/homelab/plex/config:/config
      - /mnt/hdd-storage/media:/media:ro
    networks:
      - homelab

networks:
  homelab:
    external: true
