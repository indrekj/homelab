services:
  traefik:
    image: traefik:v3.3.7
    container_name: traefik
    restart: unless-stopped
    # Traefik runs as root and terminates TLS for every service, which makes it
    # the most reachable container in the stack and the worst one to leave with
    # the default capability set. It needs exactly one: NET_BIND_SERVICE, to
    # bind :80 and :443 — dropping ALL without adding it back fails even as
    # root, because the privileged-port check is capability-based. Reading its
    # own root-owned 0600 acme.json needs nothing extra.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      CF_DNS_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    command:
      - --api.dashboard=false
      # Routing comes from ./dynamic/routes.yml, not from container labels, so
      # Traefik never touches the Docker API and needs no socket mount. See the
      # header of that file for why. `watch` reloads it without a restart.
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certresolver=cloudflare
      - --entrypoints.websecure.http.tls.domains[0].main=urgas.eu
      - --entrypoints.websecure.http.tls.domains[0].sans=*.urgas.eu
      - --certificatesresolvers.cloudflare.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.cloudflare.acme.dnschallenge=true
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dynamic:/etc/traefik/dynamic:ro
      - /mnt/ssd-storage/homelab/traefik/acme.json:/letsencrypt/acme.json
    networks:
      - homelab

networks:
  homelab:
    external: true
