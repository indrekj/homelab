services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: mosquitto
    restart: unless-stopped
    # The broker starts as root and drops itself to the `mosquitto` user
    # (1883) via setuid rather than being started as that user, so SETUID and
    # SETGID. The entrypoint's chown of /mosquitto/data gets no capabilities:
    # that directory is not mounted, the image already ships it owned by
    # mosquitto, persistence is off, and the chown is wrapped in `|| true`.
    # No KILL: it is a single process with no supervisor signalling across
    # uids. 1883 is unprivileged, so no NET_BIND_SERVICE either.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    environment:
      EMS_ESP_MQTT_PASSWORD: ${EMS_ESP_MQTT_PASSWORD:?}
      HOMEASSISTANT_MQTT_PASSWORD: ${HOMEASSISTANT_MQTT_PASSWORD:?}
    # Builds the password file from .env on every start, then runs the
    # image's default command. It goes to /tmp because the config mount is
    # read-only. Mosquitto reads it only after dropping to its own user, and
    # root has no CHOWN here, so chmod makes it readable instead. `$$` leaves
    # the variables for the container's shell, so the passwords do not show
    # up in the command line.
    command:
      - sh
      - -ec
      - |
        mosquitto_passwd -c -b /tmp/passwd ems-esp "$$EMS_ESP_MQTT_PASSWORD"
        mosquitto_passwd -b /tmp/passwd homeassistant "$$HOMEASSISTANT_MQTT_PASSWORD"
        chmod 644 /tmp/passwd
        exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "1883:1883"
    volumes:
      # Directory mount: rsync replaces files via rename, and a single-file
      # mount would pin the old inode (see README).
      - ./config:/mosquitto/config:ro
    networks:
      - homelab
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  homelab:
    external: true
