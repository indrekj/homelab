listener 1883
# Anonymous clients stay allowed for the Shellies, but the ACL limits them to
# their own topics. A client that sends a username must match password_file.
allow_anonymous true
# Generated from .env at container start. See docker-compose.yml.
password_file /tmp/passwd
acl_file /mosquitto/config/acl
persistence false
# The default also logs notice and information, which is mostly a connect
# and disconnect line for every client.
log_type error
log_type warning
