listener 1883
# Every client must log in with a user from password_file. No Shelly uses MQTT
# (see README), so nothing needs anonymous access.
allow_anonymous false
# Generated from .env at container start. See docker-compose.yml.
password_file /tmp/passwd
acl_file /mosquitto/config/acl
persistence false
# The default also logs notice and information, which is mostly a connect
# and disconnect line for every client.
log_type error
log_type warning
