# PostgreSQL — backing store for Home Assistant's `recorder` (history and
# long-term statistics). Nothing else in the stack connects to it.
#
# The 15 line is supported until November 2027. Moving to a newer major is a
# dump and restore, not a tag bump, so do it as its own change.
services:
  postgresql:
    image: postgres:15.18-trixie
    container_name: postgresql
    restart: unless-stopped
    # Run as `apps` (568), the unprivileged nologin account seerr and recyclarr
    # already use, rather than a uid that maps to a real login account on this
    # host — the same reasoning that put Plex on 568. The entrypoint skips its
    # own chown/gosu step when it is already running non-root, so PGDATA must
    # be owned by 568:568 on the host before this starts.
    user: "568:568"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATA: /var/lib/postgresql/data
      # Read by initdb only, on a fresh data directory — changing this later
      # has no effect on an existing cluster.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    # Tuning is passed as flags because the image has no conf.d include, and
    # `include_dir` is a postgresql.conf preprocessor directive rather than a
    # GUC, so it cannot be set with -c.
    #
    # Only HA's recorder connects, so the defaults mostly stand and
    # shared_buffers is the postgres default 128MB. Worst-case memory is about
    # 0.8GB, which is why the service has no compose memory limit.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - temp_buffers=4MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - max_connections=100
      # log_min_messages is already warning by default, but checkpoint lines
      # are LOG level, which ranks above warning in the server log, and 15
      # turns them on by default. They were most of the log.
      - -c
      - log_checkpoints=off
      # Cut SSD writes. Full page images guard against a torn 8K page after
      # a crash, which ZFS cannot produce because it never commits a partial
      # write (the OpenZFS workload tuning guide recommends this setting).
      # They were most of the WAL.
      - -c
      - full_page_writes=off
      # The default 5min rewrote the same few recorder pages 288 times a
      # day. Crash recovery replays up to 30 minutes of WAL, which takes
      # seconds at HA's write rate. max_wal_size stays at the 1GB default,
      # far above 30 minutes of WAL, so checkpoints stay timed.
      - -c
      - checkpoint_timeout=30min
    # Postgres needs no capabilities of its own: it starts as 568 rather than
    # dropping from root, and 5432 is unprivileged. Nothing is added back.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - /mnt/ssd-storage/homelab/postgresql/pgdata:/var/lib/postgresql/data
    # No ports published — reachable only from other services on the
    # homelab network via hostname `postgresql` on port 5432.
    networks:
      - homelab

networks:
  homelab:
    external: true
