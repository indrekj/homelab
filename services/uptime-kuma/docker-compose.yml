# Uptime monitoring for the rest of the stack. Probe other services by their
# container name on the homelab network (e.g. http://radarr:7878) — no need to
# go out through Traefik and back in.
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.4.0
    container_name: uptime-kuma
    restart: unless-stopped
    environment:
      TZ: Europe/Tallinn
    # No capabilities needed. NET_RAW would only be required for ICMP `ping`
    # monitors — every monitor here is an http or port check, both of which use
    # ordinary sockets. Add NET_RAW back if a ping monitor is ever created.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - /mnt/ssd-storage/homelab/uptime-kuma/data:/app/data
    networks:
      - homelab
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  homelab:
    external: true
