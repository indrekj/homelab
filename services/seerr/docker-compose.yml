services:
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1
    container_name: seerr
    restart: unless-stopped
    # The image ships no init process of its own.
    init: true
    # No PUID/PGID support (not a linuxserver image); run directly as the
    # media owner so the config dir migrated from overseerr stays writable.
    user: "568:568"
    environment:
      TZ: Europe/Tallinn
    # Already starts as 568 rather than dropping from root, and 5055 is
    # unprivileged, so nothing needs adding back.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - /mnt/ssd-storage/homelab/seerr/config:/app/config
    networks:
      - homelab

networks:
  homelab:
    external: true
