# Cleans the download pipeline: strikes stalled, slow, or import-failed
# downloads in the *arr queues, removes them from qBittorrent, and triggers a
# re-search. Behavior is configured in its web UI and stored under /config —
# compose only wires it up.
#
# The unlinked-downloads cleaner is unused, so it gets no media mount. It
# manages torrents through the qBittorrent and *arr APIs and never touches
# files itself.
services:
  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:2.10.11
    container_name: cleanuparr
    restart: unless-stopped
    # The entrypoint has an explicit rootless mode: started with `user:` set,
    # it skips its chown/gosu steps entirely, so nothing needs adding back
    # after cap_drop. /config must be chowned to 568 once at bootstrap.
    user: "568:568"
    environment:
      TZ: Europe/Tallinn
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:11011/health"]
      interval: 5m
      start_period: 2m
    volumes:
      - /mnt/ssd-storage/homelab/cleanuparr/config:/config
      # The malware blocker's allowlist for Radarr and Sonarr: video,
      # subtitles and RAR volumes (.rar, then .r00 to .z99). Every other
      # file in a torrent is deselected, and a torrent with nothing left is
      # removed and searched again. Path /allowlist/allowlist and list type
      # "whitelist" (Cleanuparr's name for it) are set in the UI and stored
      # in cleanuparr.db.
      #
      # It replaces the community blocklist, which lists .rar and some .rNN
      # volumes. With delete_if_any_file_blocked off, the blocker deselected
      # those and left gaps in every RAR release that Unpackerr can never
      # extract. Archive contents are not checked, but Radarr and Sonarr
      # import only the video file and Unpackerr deletes the rest.
      #
      # Only `regex:` lines go in the file, with (?i) for case. Cleanuparr
      # treats any other line, blank or comment, as a glob, and in allowlist
      # mode a file must then match a glob and a regex, which nothing does.
      # A directory mount, like the other repo configs (see README).
      - ./allowlist:/allowlist:ro
    networks:
      - homelab

networks:
  homelab:
    external: true
