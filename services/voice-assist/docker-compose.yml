# Local voice pipeline for Home Assistant Assist (Wyoming protocol).
# No published ports — Home Assistant reaches these over the homelab
# network as whisper:10300 and piper:10200.
services:
  whisper:
    image: rhasspy/wyoming-whisper:3.7.0
    container_name: whisper
    restart: unless-stopped
    command: --model small.en --compute-type int8 --language en
    environment:
      TZ: Europe/Tallinn
    # Plain Python process on an unprivileged port, no init that chowns or
    # changes user, so it needs no capabilities.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - /mnt/ssd-storage/homelab/voice-assist/whisper:/data
    networks:
      - homelab
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 2G

  piper:
    image: rhasspy/wyoming-piper:2.4.2
    container_name: piper
    restart: unless-stopped
    command: --voice en_US-lessac-medium
    environment:
      TZ: Europe/Tallinn
    # Same as whisper above — no capabilities required.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - /mnt/ssd-storage/homelab/voice-assist/piper:/data
    networks:
      - homelab
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  homelab:
    external: true
