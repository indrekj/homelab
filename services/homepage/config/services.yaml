# Tiles link out through Traefik. There is no live container status any more —
# Homepage no longer mounts the docker socket (see ../docker-compose.yml for
# why), so `server`/`container` were dropped along with the status-only tiles
# for Traefik, PostgreSQL, Mosquitto, Whisper and Piper, which had no link and
# existed purely to render a status dot. Uptime Kuma covers liveness.
- Media:
    - Plex:
        icon: plex.png
        href: https://plex.urgas.eu
        description: Media server
    - Seerr:
        icon: overseerr.png
        href: https://seerr.urgas.eu
