# Dashboard/landing page for the whole stack. Config is declarative and lives
# in ./config (version-controlled, mounted read-only like mosquitto.conf).
# The docker socket lets service tiles show live container status. NOTE: `:ro`
# only protects the socket file, not the API — this container can still create
# privileged containers, i.e. it holds root on the host. Traefik used to mount
# it too and no longer does (see services/traefik/dynamic/routes.yml); Homepage
# is now the last container with that access. Drop the mount and lose the
# status tiles, or front it with a docker-socket-proxy, when you get to it.
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.13.2
    container_name: homepage
    restart: unless-stopped
    environment:
      TZ: Europe/Tallinn
      # Homepage refuses requests whose Host header isn't allow-listed.
      HOMEPAGE_ALLOWED_HOSTS: homepage.urgas.eu,home.urgas.eu
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homelab
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  homelab:
    external: true
