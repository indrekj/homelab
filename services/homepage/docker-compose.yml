# Dashboard/landing page for the whole stack. Config is declarative and lives
# in ./config (version-controlled). Unlike mosquitto.conf the mount is
# writable: Homepage writes generated defaults (docker.yaml, custom.css) and
# its log into that directory on first start.
#
# Deliberately does NOT mount the docker socket. It used to, for live container
# status tiles, but `:ro` on a socket mount only protects the file — not the
# API — so the container could create privileged containers and take root on
# the host. Traefik was moved off the socket first (see
# services/traefik/dynamic/routes.yml); this removed the last holder. Tiles are
# plain links now; Uptime Kuma covers liveness.
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.0.0
    container_name: homepage
    restart: unless-stopped
    environment:
      TZ: Europe/Tallinn
      # Homepage refuses requests whose Host header isn't allow-listed.
      HOMEPAGE_ALLOWED_HOSTS: homepage.urgas.eu,home.urgas.eu
    # Plain Node process on an unprivileged port, with no init that chowns or
    # changes user, so it needs no capabilities at all.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./config:/app/config
    networks:
      - homelab
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  homelab:
    external: true
