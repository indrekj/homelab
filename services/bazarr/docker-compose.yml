services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:1.6.0
    container_name: bazarr
    restart: unless-stopped
    environment:
      TZ: Europe/Tallinn
      # Matches the owner of /mnt/hdd-storage/media so downloaded subtitles
      # land next to the video files and stay readable by Plex.
      PUID: "568"
      PGID: "568"
    # The s6 init needs these to chown /config and drop to PUID/PGID; Bazarr
    # itself needs none of them. Everything else — NET_RAW, MKNOD, SYS_PTRACE
    # and friends — is dropped. See services/qbittorrent/docker-compose.yml for
    # the full rationale.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - KILL
    volumes:
      - /mnt/ssd-storage/homelab/bazarr/config:/config
      # Same mount and path as Radarr/Sonarr so no path mapping is needed
      # when Bazarr reads their libraries.
      - /mnt/hdd-storage/media:/data
    networks:
      - homelab

networks:
  homelab:
    external: true
